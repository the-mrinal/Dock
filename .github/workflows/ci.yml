name: CI

# The repo had no test gate at all — package.yml is workflow_dispatch APK
# building. Anything that can regress silently should not be able to.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare local.properties
        # The secrets only matter for release builds; unit tests and lint just
        # need the keys to exist so BuildConfig compiles.
        run: |
          cat > local.properties <<'EOF'
          spotify.clientId=ci-placeholder
          unsplash.accessKey=ci-placeholder
          google.oauth.client.id=ci-placeholder
          google.oauth.client.secret=ci-placeholder
          google.oauth.refresh.token=ci-placeholder
          EOF

      - name: Unit tests
        run: ./gradlew :app:testFiretvDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintFiretvDebug --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 7
