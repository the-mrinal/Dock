name: Package APKs

# Manual-only: builds signed release APKs and attaches them as assets to
# an existing GitHub Release. Triggered when you actually want binaries —
# every merge to main produces a tag + release via semantic-release, but
# NOT an APK. APKs cost CI minutes, so they're opt-in.
#
#   gh workflow run package.yml -f tag=v2.1.0
#   gh workflow run package.yml -f tag=v2.1.0 -f flavor=firetv

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v2.1.0). Defaults to the latest release."
        required: false
        default: ""
      flavor:
        description: "Which flavor(s) to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - firetv
          - googletv

concurrency:
  group: package-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Build & upload APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "No tag input — using latest release: $TAG"
          else
            TAG="$INPUT_TAG"
            echo "Building tag from input: $TAG"
            # Validate the release exists; fail fast otherwise.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install required SDK components
        run: |
          set -euo pipefail
          # (yes || true): yes dies with SIGPIPE once sdkmanager stops reading
          # stdin; without the guard, pipefail turns that into a job failure.
          (yes || true) | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare local.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        id: signing
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
            echo "spotify.clientId=$SPOTIFY_CLIENT_ID" >> local.properties
          fi

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. APKs will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p .signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/release.keystore
          {
            echo "signing.keystoreFile=$(pwd)/.signing/release.keystore"
            echo "signing.keystorePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "signing.keyAlias=$ANDROID_KEY_ALIAS"
            echo "signing.keyPassword=$ANDROID_KEY_PASSWORD"
          } >> local.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build firetv release APK
        if: inputs.flavor == 'firetv' || inputs.flavor == 'both'
        run: ./gradlew :app:assembleFiretvRelease --no-daemon --stacktrace

      - name: Build googletv release APK
        if: inputs.flavor == 'googletv' || inputs.flavor == 'both'
        run: ./gradlew :app:assembleGoogletvRelease --no-daemon --stacktrace

      - name: Stage APKs for upload
        id: stage
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          for apk in app/build/outputs/apk/*/release/*.apk; do
            name=$(basename "$apk" .apk)
            cp "$apk" "artifacts/${name}-${TAG}.apk"
          done
          echo "Staged:"
          ls -lh artifacts/

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" artifacts/*.apk --clobber

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            echo "## Package run for $TAG"
            echo
            echo "- **Flavor(s):** ${{ inputs.flavor }}"
            if [ "$SIGNED" = "true" ]; then
              echo "- **Signing:** release keystore"
            else
              echo "- **Signing:** debug key (release keystore not configured — run \`scripts/setup-signing.sh\` to fix)"
            fi
            echo "- **Artifacts:**"
            for apk in artifacts/*.apk; do
              echo "  - \`$(basename "$apk")\`"
            done
            echo
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
