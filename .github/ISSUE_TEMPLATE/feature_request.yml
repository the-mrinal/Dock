name: Feature request
description: A small, calm idea for something the dock could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This dock is intentionally minimal. New features are welcome, but the bar is "does this make the **resting** screen better?" — interruptive features (notifications, modals, popovers) are almost always declined. See CONTRIBUTING.md → *What I'm unlikely to merge*.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do when you wished the dock did this?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like to see
      description: Concrete behaviour, ideally with a sketch of the visual or the input flow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: What workarounds exist today? Why aren't they good enough?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This doesn't require a cloud service, account, or telemetry.
          required: true
        - label: This doesn't interrupt the user when they're not looking at the screen.
          required: true
